<!doctype html>
<html lang="en">
<head>
<script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.182.0/examples/jsm/",
      "troika-three-text": "https://cdn.jsdelivr.net/gh/protectwise/troika@028b81cf308f0f22e5aa8e78196be56ec1997af5/packages/troika-three-text/src/index.js",
      "troika-three-utils": "https://cdn.jsdelivr.net/gh/protectwise/troika@v0.52.4/packages/troika-three-utils/src/index.js",
      "troika-worker-utils": "https://cdn.jsdelivr.net/gh/protectwise/troika@v0.52.4/packages/troika-worker-utils/src/index.js",
      "bidi-js": "https://esm.sh/bidi-js@%5E1.0.2?target=es2022",
      "webgl-sdf-generator": "https://esm.sh/webgl-sdf-generator@1.1.1/es2022/webgl-sdf-generator.mjs",
      "@dimforge/rapier3d-simd-compat": "https://cdn.skypack.dev/@dimforge/rapier3d-simd-compat@0.17.0",
      "xrblocks": "https://cdn.jsdelivr.net/gh/google/xrblocks@build/xrblocks.js"
    }
  }
</script>
<script type="module">
import * as xb from 'xrblocks';

const o = new xb.Options();
o.enableUI();
xb.init(o);

setTimeout(() => {
    let output = "XB KEYS: " + Object.keys(xb).join(", ") + "\n\n";
    if (xb.screenshotSynthesizer) {
        output += "ScreenshotSynthesizer Methods: " + Object.keys(xb.screenshotSynthesizer).join(", ") + "\n\n";
    }
    const screenshotMethods = Object.keys(xb).filter(k => k.toLowerCase().includes('screen') || k.toLowerCase().includes('canvas'));
    output += "Screenshot related properties: " + screenshotMethods.join(", ") + "\n\n";
    
    // Create an invisible div with the output to be read
    const div = document.createElement('div');
    div.id = 'output';
    div.innerText = output;
    document.body.appendChild(div);
    console.log(output);
}, 2000);
</script>
</head>
<body>
<h1>Testing XRBlocks API</h1>
</body>
</html>
