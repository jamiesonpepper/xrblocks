<!doctype html>
<html lang="en">
<head>
    <title>XRHome Foyer Pairing</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
        body {
            background: #111;
            color: #ddd;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .config-box {
            background: #222;
            padding: 24px;
            border-radius: 8px;
            width: 90%;
            max-width: 500px;
        }
        .input-group {
            margin-bottom: 16px;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #aaa;
        }
        .input-group input {
            width: 100%;
            padding: 8px;
            background: #333;
            border: 1px solid #444;
            color: white;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #4285f4;
            border: none;
            color: white;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background: #5c97f6; }
        #status {
            margin-top: 12px;
            color: #4caf50;
            text-align: center;
        }
        #ui-panel { display: none; }
    </style>
    <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js",
        "firebase/database": "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js"
      }
    }
    </script>
</head>
<body>

    <div class="config-box">
        <h2>XRHome Foyer Pairing</h2>
        <p style="font-size: 13px; color: #888;">Synchronize your home.google.com session directly to your headset.</p>
        
        <div id="auth-panel">
            <button id="auth-btn">Sign in with Google First</button>
        </div>

        <div id="ui-panel">
            <form id="save-form">
                <div class="input-group">
                    <label>Authorization Header (SAPISIDHASH...)</label>
                    <input type="text" id="auto-oauth-token" autocomplete="off" required />
                </div>
                <div class="input-group">
                    <label>Cookie Header (__Secure-1PSID...)</label>
                    <input type="text" id="auto-cookie-token" autocomplete="off" required />
                </div>
                <button type="submit" id="save-btn">Save to Headset</button>
                <div id="status"></div>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'firebase/app';
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from 'firebase/auth';
        import { getDatabase, ref, set, get } from 'firebase/database';

        async function init() {
            const response = await fetch('/api/config');
            const config = await response.json();
            
            const firebaseApp = initializeApp({
                apiKey: config.firebaseApiKey,
                authDomain: `${config.projectId}.firebaseapp.com`,
                projectId: config.projectId,
                databaseURL: `https://${config.projectId}-default-rtdb.firebaseio.com/`
            });
            
            const auth = getAuth(firebaseApp);
            const db = getDatabase(firebaseApp);

            const authBtn = document.getElementById('auth-btn');
            const authPanel = document.getElementById('auth-panel');
            const uiPanel = document.getElementById('ui-panel');
            const statusDiv = document.getElementById('status');
            const form = document.getElementById('save-form');
            
            authBtn.addEventListener('click', () => {
                signInWithPopup(auth, new GoogleAuthProvider());
            });

            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    authPanel.style.display = 'none';
                    uiPanel.style.display = 'block';
                    
                    // Fetch existing
                    const snapshot = await get(ref(db, `users/${user.uid}/foyerCredentials`));
                    if (snapshot.exists()) {
                        const vals = snapshot.val();
                        document.getElementById('auto-oauth-token').value = vals.authorization || "";
                        document.getElementById('auto-cookie-token').value = vals.cookie || "";
                    }
                } else {
                    authPanel.style.display = 'block';
                    uiPanel.style.display = 'none';
                }
            });

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const user = auth.currentUser;
                if (!user) return;
                
                const authorization = document.getElementById('auto-oauth-token').value;
                const cookie = document.getElementById('auto-cookie-token').value;
                
                statusDiv.innerText = "Saving...";
                await set(ref(db, `users/${user.uid}/foyerCredentials`), {
                    authorization,
                    cookie,
                    updatedAt: Date.now()
                });
                statusDiv.innerText = "Saved successfully! You can now put on your headset.";
            });
        }
        
        init();
    </script>
</body>
</html>
